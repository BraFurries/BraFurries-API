name: Deploy API em Produção

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-secret-scan:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.BRF_API_AUTO_DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan code and history with pinned Gitleaks
        run: |
          set -euo pipefail
          docker run --rm \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="--all" --redact=100

  build-image:
    if: ${{ github.ref == 'refs/heads/main' && needs.deploy-secret-scan.result == 'success' }}
    needs: deploy-secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests on GitHub-hosted runner
        run: ./mvnw test

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push immutable API image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/brafurries/brafurries-api:${{ github.sha }}

      - name: Verify image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Invalid or missing GHCR digest" >&2
            exit 1
          }

  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' && needs.build-image.result == 'success' }}
    needs: build-image
    runs-on:
      group: api-production
      labels: [self-hosted, BRFAPI]

    concurrency:
      group: brafurries-api-production-deploy
      cancel-in-progress: false

    environment:
      name: Produção

    permissions:
      contents: read
      packages: read

    steps:
      - name: Reject outdated main revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(
            curl -fsS --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/main" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"
          if [[ "$CURRENT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Refusing stale API deployment: main has advanced." >&2
            exit 1
          fi

      - name: Stage production environment
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -euo pipefail
          if [[ -z "${PROD_ENV_FILE:-}" ]]; then
            echo "PROD_ENV_FILE is missing or empty." >&2
            exit 1
          fi
          printf '%s' "$PROD_ENV_FILE" \
            | sudo -n /usr/local/sbin/update-brafurries-api-env stage

      - name: Record staged environment status
        run: sudo -n /usr/local/sbin/update-brafurries-api-env status

      - name: Deploy immutable API image
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/brafurries/brafurries-api@${DIGEST}"
          if ! [[ "$IMAGE" =~ ^ghcr\.io/brafurries/brafurries-api@sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid immutable API image reference" >&2
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" \
            | sudo -n /usr/local/sbin/deploy-brafurries-api deploy "$IMAGE" "$GHCR_USER"

      - name: Validate local readiness
        run: curl -fsS --max-time 20 http://127.0.0.1:18080/actuator/health/readiness >/dev/null

      - name: Validate local API endpoint
        run: curl -fsS --max-time 20 http://127.0.0.1:18080/meta/locales >/dev/null

      - name: Validate local Firebase preview CORS
        run: |
          set -euo pipefail
          ORIGIN="https://brafurries--cors-smoke.web.app"
          HEADERS="$(mktemp)"
          trap 'rm -f "$HEADERS"' EXIT
          curl -fsS --max-time 20 -D "$HEADERS" -o /dev/null -X OPTIONS \
            http://127.0.0.1:18080/auth/login \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
          grep -Fqi "Access-Control-Allow-Origin: $ORIGIN" "$HEADERS"

      - name: Record final wrapper status
        run: sudo -n /usr/local/sbin/deploy-brafurries-api status

      - name: Validate public API and CORS
        run: |
          set -euo pipefail
          ORIGIN="https://brafurries--cors-smoke.web.app"
          HEADERS="$(mktemp)"
          trap 'rm -f "$HEADERS"' EXIT
          HTTP_CODE="$(curl -sS --connect-timeout 10 --max-time 20 \
            -D "$HEADERS" -o /dev/null -w '%{http_code}' -X OPTIONS \
            https://api.brafurries.com.br/auth/login \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type")"
          [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]
          grep -Fqi "Access-Control-Allow-Origin: $ORIGIN" "$HEADERS"

      - name: Discard staged environment after failure or cancellation
        if: ${{ failure() || cancelled() }}
        run: sudo -n /usr/local/sbin/update-brafurries-api-env discard
