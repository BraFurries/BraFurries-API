name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        run: |
          set -euo pipefail

          REPORT_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$REPORT_DIR"' EXIT

          set +e
          docker run --rm \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            --mount type=bind,source="$REPORT_DIR",target=/reports \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="--all" --redact=100 \
              --report-format json --report-path /reports/gitleaks.json
          SCAN_RC="$?"
          set -e

          if [[ "$SCAN_RC" -ne 0 && -f "$REPORT_DIR/gitleaks.json" ]]; then
            # Report is temporary; log *metadata only*, never the secret or match.
            python3 - "$REPORT_DIR/gitleaks.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as report:
              findings = json.load(report)
          for finding in findings:
              print("Gitleaks finding metadata:", {
                  "file": finding.get("File"),
                  "line": finding.get("StartLine"),
                  "rule": finding.get("RuleID"),
                  "commit": finding.get("Commit"),
              })
          PY
          fi

          exit "$SCAN_RC"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Check production workflow safety invariants
        run: python3 scripts/ci/check_production_workflow.py

      - name: Run tests
        run: ./mvnw test

      - name: Checkout pinned Database baseline for disposable tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BraFurries/BraFurries-Database
          ref: 0df5070079d26d18752282c642a9ff10037c8bfb
          path: .ci/database-baseline
          persist-credentials: false

      - name: Verify baseline source and run opt-in MariaDB Testcontainers compatibility
        env:
          BRF_BASELINE_JPA_INTEGRATION: "true"
        run: |
          set -euo pipefail
          expected_sha="0df5070079d26d18752282c642a9ff10037c8bfb"
          test "$(git -C .ci/database-baseline rev-parse HEAD)" = "$expected_sha"
          baseline=".ci/database-baseline/flyway/sql/baseline/B20261020_001__adopt_production_schema.sql"
          test "$(grep -c '^CREATE TABLE ' "$baseline")" -eq 107
          mkdir -p src/test/resources
          cp "$baseline" src/test/resources/brafurries_schema_baseline.sql
          ./mvnw -B -Dtest=BaselineSchemaJpaMariaDbIntegrationTest,BaselineSchemaFullContextMariaDbIntegrationTest test

      # Run a real loopback HTTP request path against the Spring service and
      # canonical disposable MariaDB, using Coddy's pinned Python client.
      # Nothing here contacts Discord or any production host.
      - name: Checkout pinned Coddy runtime client (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BraFurries/BraFurries-Discord
          ref: f600081624e124874dfd558dfc8255722c3a8fc7
          path: .ci/coddy-runtime
          persist-credentials: false

      - name: Install isolated Coddy HTTP client dependencies
        run: |
          set -euo pipefail
          test "$(git -C .ci/coddy-runtime rev-parse HEAD)" = "f600081624e124874dfd558dfc8255722c3a8fc7"
          python3 -m pip install --disable-pip-version-check aiohttp==3.9.3 discord.py==2.3.2

      - name: Verify actual Coddy to Spring loopback HTTP contract on disposable MariaDB
        env:
          BRF_CODDY_LIVE_HTTP_INTEGRATION: "true"
        run: |
          set -euo pipefail
          test "$(git -C .ci/database-baseline rev-parse HEAD)" = "0df5070079d26d18752282c642a9ff10037c8bfb"
          test "$(git -C .ci/coddy-runtime rev-parse HEAD)" = "f600081624e124874dfd558dfc8255722c3a8fc7"
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('src/test/resources/coddy_live_http_contract.py').read_text())"
          ./mvnw -B -Dtest=BaselineCoddyLiveHttpIntegrationTest test

      # Recruitment is disabled by default; opt-in JDBC integration uses
      # the exact unmerged Database PR #12 migration on disposable MariaDB.
      - name: Checkout pinned recruitment schema migration (read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BraFurries/BraFurries-Database
          ref: 0d91257958aa8b878dcd9387352e8a98b4182d61
          path: .ci/recruitment-database
          persist-credentials: false

      - name: Verify recruitment drafts JDBC with canonical baseline plus additive migration
        env:
          BRF_RECRUITMENT_JDBC_INTEGRATION: "true"
        run: |
          set -euo pipefail
          test "$(git -C .ci/recruitment-database rev-parse HEAD)" = "0d91257958aa8b878dcd9387352e8a98b4182d61"
          baseline=".ci/database-baseline/flyway/sql/baseline/B20261020_001__adopt_production_schema.sql"
          migration=".ci/recruitment-database/flyway/sql/versioned/V20261021_001__create_recruitment_foundation.sql"
          revision=".ci/recruitment-database/flyway/sql/versioned/V20261022_001__add_recruitment_draft_revision.sql"
          test "$(grep -c '^CREATE TABLE ' "$baseline")" -eq 107
          test "$(grep -c '^CREATE TABLE ' "$migration")" -eq 5
          test "$(grep -c '^ALTER TABLE ' "$revision")" -eq 1
          submission=".ci/recruitment-database/flyway/sql/versioned/V20261022_002__create_recruitment_application_submissions.sql"
          test "$(grep -c '^CREATE TABLE ' "$submission")" -eq 1
          review=".ci/recruitment-database/flyway/sql/versioned/V20261022_003__create_recruitment_human_review.sql"
          test -s "$review"
          decisions=".ci/recruitment-database/flyway/sql/versioned/V20261022_004__create_recruitment_stage_decisions.sql"
          test -s "$decisions"
          ballots=".ci/recruitment-database/flyway/sql/versioned/V20261023_001__create_recruitment_stage_votes.sql"
          test -s "$ballots"
          attempts=".ci/recruitment-database/flyway/sql/versioned/V20261023_002__create_recruitment_candidate_attempts.sql"
          test -s "$attempts"
          objective=".ci/recruitment-database/flyway/sql/versioned/V20261023_003__create_recruitment_objective_grades.sql"
          test -s "$objective"
          finalization=".ci/recruitment-database/flyway/sql/versioned/V20261023_004__extend_recruitment_objective_decisions.sql"
          test -s "$finalization"
          visibility=".ci/recruitment-database/flyway/sql/versioned/V20261023_005__add_recruitment_exam_score_visibility.sql"
          test -s "$visibility"
          integrity=".ci/recruitment-database/flyway/sql/versioned/V20261023_006__create_recruitment_exam_integrity_events.sql"
          test -s "$integrity"
          reinstatement=".ci/recruitment-database/flyway/sql/versioned/V20261023_007__create_recruitment_exam_reinstatements.sql"
          test -s "$reinstatement"
          cat "$baseline" "$migration" "$revision" "$submission" "$review" "$decisions" "$ballots" "$attempts" "$objective" "$finalization" "$visibility" "$integrity" "$reinstatement" > src/test/resources/recruitment_schema.sql
          ./mvnw -B -Dtest=RecruitmentDraftJdbcMariaDbIntegrationTest,RecruitmentStageEditorJdbcMariaDbIntegrationTest,RecruitmentPublicationJdbcMariaDbIntegrationTest,RecruitmentCandidateJdbcMariaDbIntegrationTest,RecruitmentTrackingJdbcMariaDbIntegrationTest,RecruitmentHumanReviewJdbcMariaDbIntegrationTest,RecruitmentStageDecisionJdbcMariaDbIntegrationTest,RecruitmentDecisionPolicyJdbcMariaDbIntegrationTest,RecruitmentDecisionDeskJdbcMariaDbIntegrationTest,RecruitmentStageVotingJdbcMariaDbIntegrationTest,RecruitmentCandidateAttemptJdbcMariaDbIntegrationTest,RecruitmentObjectiveGradeJdbcMariaDbIntegrationTest test

      - name: Package without rerunning tests
        run: ./mvnw -DskipTests package
