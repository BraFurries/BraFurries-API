app.base-url=${BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
# Firebase Hosting Preview Channels (https://brafurries--*.web.app) are appended by SecurityConfig.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:https://brafurries.com.br,https://www.brafurries.com.br,http://localhost:4200}}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Database
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Uploads
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}

# Cloudflare R2 / S3-compatible storage
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
app.storage.r2.access-key=${R2_ACCESS_KEY:}
app.storage.r2.secret-key=${R2_SECRET_KEY:}

# JWT
jwt.base-key=${JWT_BASE_KEY}
jwt.expiration=${JWT_EXPIRATION:900}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600}
jwt.rotation-interval=${JWT_ROTATION_INTERVAL:86400}

# E-mail verification
app.auth.email-verification-expiration-hours=${EMAIL_VERIFICATION_EXPIRATION_HOURS:1}
app.auth.email-verification-cleanup-ms=${EMAIL_VERIFICATION_CLEANUP_MS:3600000}


# SMTP para envio do link de recuperação
spring.mail.host=${SMTP_HOST:smtp.zoho.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# Google Calendar
google_project_id=${GOOGLE_PROJECT_ID:brafurries}
google_token_uri=${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
google_auth_provider_x509_cert_url=${GOOGLE_AUTH_PROVIDER_X509_CERT_URL:https://www.googleapis.com/oauth2/v1/certs}
google_service_account_email=${GOOGLE_SERVICE_ACCOUNT_EMAIL:}
google_service_account_private_key=${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:}
google_calendar_events_id=${GOOGLE_CALENDAR_EVENTS_ID:}
google_calendar_pending_events_id=${GOOGLE_CALENDAR_PENDING_EVENTS_ID:}
google_calendar_rejected_events_id=${GOOGLE_CALENDAR_REJECTED_EVENTS_ID:}

# Discord
discord_token=${DISCORD_TOKEN:}

# Admin integrations
app.bot.base-url=${BOT_BASE_URL:http://127.0.0.1:18088}
app.bot.status-token=${BOT_STATUS_TOKEN:}
app.bot.connect-timeout-ms=${BOT_CONNECT_TIMEOUT_MS:2000}
app.bot.read-timeout-ms=${BOT_READ_TIMEOUT_MS:3000}
app.announcements.discord.enabled=${ANNOUNCEMENTS_DISCORD_ENABLED:false}
app.announcements.discord.target-name=${ANNOUNCEMENTS_DISCORD_TARGET_NAME:Discord}
app.announcements.telegram.enabled=${ANNOUNCEMENTS_TELEGRAM_ENABLED:false}
app.announcements.telegram.target-name=${ANNOUNCEMENTS_TELEGRAM_TARGET_NAME:Telegram}
app.announcements.max-image-size-mb=${ANNOUNCEMENTS_MAX_IMAGE_SIZE_MB:5}
app.announcements.allowed-image-types=${ANNOUNCEMENTS_ALLOWED_IMAGE_TYPES:image/png,image/jpeg,image/webp,image/gif}

# OpenAPI / Swagger
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/docs}
springdoc.api-docs.path=${OPENAPI_DOCS_PATH:/docs/openapi}

# Cache
app.cache.dashboard.ttl-seconds=${DASHBOARD_CACHE_TTL_SECONDS:60}
app.cache.dashboard.max-size=${DASHBOARD_CACHE_MAX_SIZE:10000}
